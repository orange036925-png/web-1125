<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>萌萌馬卡龍時鐘 - Cute Pastel Clock</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入圓潤可愛的繁體中文字體 (Zen Maru Gothic & Nunito) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cute: ['"Zen Maru Gothic"', '"Nunito"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* 定義四種馬卡龍與深夜主題的 CSS 變數 */
        :root, [data-theme="strawberry"] {
            --bg-gradient: linear-gradient(135deg, #FFE4EC 0%, #FFF5F7 50%, #FFD6E4 100%);
            --card-bg: rgba(255, 255, 255, 0.88);
            --card-border: #FFB7CE;
            --clock-face: #FFFDFD;
            --clock-rim: #FF8FAB;
            --clock-shadow: rgba(255, 143, 171, 0.25);
            --text-primary: #5E3A47;
            --text-secondary: #9E6B7B;
            --accent-main: #FF7096;
            --accent-sub: #FFB3C6;
            --hand-hour: #5E3A47;
            --hand-min: #FF7096;
            --hand-sec: #FFC300;
            --cheek-color: #FF8FA3;
            --floating-color: rgba(255, 255, 255, 0.75);
        }

        [data-theme="matcha"] {
            --bg-gradient: linear-gradient(135deg, #E2F3E4 0%, #FAF8E6 50%, #D4EDDA 100%);
            --card-bg: rgba(255, 254, 245, 0.88);
            --card-border: #A8D5BA;
            --clock-face: #FFFFFA;
            --clock-rim: #74B49B;
            --clock-shadow: rgba(116, 180, 155, 0.25);
            --text-primary: #3D5245;
            --text-secondary: #6E8B78;
            --accent-main: #6BBF8A;
            --accent-sub: #F6D55C;
            --hand-hour: #3D5245;
            --hand-min: #529E72;
            --hand-sec: #F4A261;
            --cheek-color: #FFA69E;
            --floating-color: rgba(255, 255, 255, 0.75);
        }

        [data-theme="soda"] {
            --bg-gradient: linear-gradient(135deg, #D8F3FF 0%, #F0FAFF 50%, #BDE0FE 100%);
            --card-bg: rgba(255, 255, 255, 0.88);
            --card-border: #90E0EF;
            --clock-face: #FAFDFF;
            --clock-rim: #48CAE4;
            --clock-shadow: rgba(72, 202, 228, 0.25);
            --text-primary: #2B4C65;
            --text-secondary: #5E88A8;
            --accent-main: #00B4D8;
            --accent-sub: #90E0EF;
            --hand-hour: #2B4C65;
            --hand-min: #0096C7;
            --hand-sec: #FF9F1C;
            --cheek-color: #FF99AC;
            --floating-color: rgba(255, 255, 255, 0.85);
        }

        [data-theme="starry"] {
            --bg-gradient: linear-gradient(135deg, #1E1B4B 0%, #312E81 50%, #1E293B 100%);
            --card-bg: rgba(30, 27, 75, 0.78);
            --card-border: #6366F1;
            --clock-face: #25225C;
            --clock-rim: #818CF8;
            --clock-shadow: rgba(99, 102, 241, 0.35);
            --text-primary: #F8FAFC;
            --text-secondary: #C7D2FE;
            --accent-main: #FBBF24;
            --accent-sub: #6366F1;
            --hand-hour: #F8FAFC;
            --hand-min: #A5B4FC;
            --hand-sec: #FBBF24;
            --cheek-color: #F472B6;
            --floating-color: rgba(253, 224, 71, 0.8);
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-primary);
            transition: background 0.6s ease, color 0.4s ease;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .theme-card {
            background-color: var(--card-bg);
            border: 3px solid var(--card-border);
            box-shadow: 0 18px 40px -10px var(--clock-shadow);
            backdrop-filter: blur(12px);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .clock-dial {
            background-color: var(--clock-face);
            border: 8px solid var(--clock-rim);
            box-shadow: inset 0 6px 16px rgba(0, 0, 0, 0.06), 0 10px 25px var(--clock-shadow);
            transition: all 0.4s ease;
        }

        /* 漂浮背景動畫 */
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) translateX(0px); }
            50% { transform: translateY(-18px) translateX(12px); }
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.85); }
            50% { opacity: 1; transform: scale(1.15); }
        }

        .floating-item {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            animation: floatSlow 7s ease-in-out infinite;
        }

        /* 氣泡彈出動畫 */
        @keyframes popBubble {
            0% { opacity: 0; transform: translate(-50%, 10px) scale(0.7); }
            15% { opacity: 1; transform: translate(-50%, -6px) scale(1.06); }
            25% { transform: translate(-50%, 0px) scale(1); }
            85% { opacity: 1; transform: translate(-50%, 0px) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -10px) scale(0.9); }
        }

        .speech-bubble {
            animation: popBubble 3.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* 時鐘Q彈點擊效果 */
        .clock-bounce:active {
            transform: scale(0.95);
        }

        /* 眨眼動畫 */
        .eye-open {
            transition: transform 0.15s ease;
            transform-origin: center;
        }
        .blinking .eye-open {
            transform: scaleY(0.1);
        }

        /* 自訂按鈕按壓感 */
        .cute-btn {
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .cute-btn:hover {
            transform: translateY(-2px);
        }
        .cute-btn:active {
            transform: translateY(1px) scale(0.96);
        }
    </style>
</head>
<body class="font-cute flex flex-col items-center justify-center p-4 sm:p-6 select-none relative">

    <!-- 背景漂浮裝飾層 (雲朵或星星) -->
    <div id="bg-decorations" class="fixed inset-0 pointer-events-none overflow-hidden z-0"></div>

    <!-- 主容器 -->
    <main class="relative z-10 w-full max-w-md mx-auto flex flex-col items-center gap-4">
        
        <!-- 頂部控制列：主題切換 & 音效開關 -->
        <header class="w-full theme-card rounded-3xl px-4 py-3 flex flex-wrap items-center justify-between gap-2">
            <!-- 主題選擇器 -->
            <div class="flex items-center gap-1.5" role="group" aria-label="切換可愛主題">
                <button onclick="setTheme('strawberry')" title="草莓牛奶" data-theme-btn="strawberry"
                    class="cute-btn w-8 h-8 rounded-full bg-[#FF8FAB] border-2 border-white shadow-sm flex items-center justify-center text-xs ring-2 ring-offset-1 ring-[#FF7096]">
                    🍓
                </button>
                <button onclick="setTheme('matcha')" title="抹茶布丁" data-theme-btn="matcha"
                    class="cute-btn w-8 h-8 rounded-full bg-[#74B49B] border-2 border-white shadow-sm flex items-center justify-center text-xs">
                    🍮
                </button>
                <button onclick="setTheme('soda')" title="蘇打汽水" data-theme-btn="soda"
                    class="cute-btn w-8 h-8 rounded-full bg-[#48CAE4] border-2 border-white shadow-sm flex items-center justify-center text-xs">
                    🫧
                </button>
                <button onclick="setTheme('starry')" title="深夜星空" data-theme-btn="starry"
                    class="cute-btn w-8 h-8 rounded-full bg-[#312E81] border-2 border-[#818CF8] shadow-sm flex items-center justify-center text-xs">
                    🌙
                </button>
            </div>

            <!-- 當前主題名稱標籤 -->
            <span id="theme-label" class="text-xs sm:text-sm font-bold tracking-wider px-2.5 py-1 rounded-full" 
                  style="background-color: var(--accent-sub); color: var(--text-primary);">
                草莓牛奶
            </span>

            <!-- 滴答音效開關 -->
            <button id="sound-toggle" onclick="toggleSound()" 
                class="cute-btn flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs sm:text-sm font-bold shadow-sm border"
                style="background-color: var(--clock-face); border-color: var(--card-border); color: var(--text-primary);">
                <span id="sound-icon">🔇</span>
                <span id="sound-text">靜音</span>
            </button>
        </header>

        <!-- 功能分頁切換 (雙模式時鐘 / 可愛番茄鐘) -->
        <nav class="w-full grid grid-cols-2 gap-2 p-1.5 theme-card rounded-full">
            <button id="tab-clock" onclick="switchTab('clock')" 
                class="cute-btn py-2 px-4 rounded-full font-bold text-sm sm:text-base transition-all shadow-sm"
                style="background-color: var(--accent-main); color: #FFFFFF;">
                ⏰ 療癒時鐘
            </button>
            <button id="tab-pomodoro" onclick="switchTab('pomodoro')" 
                class="cute-btn py-2 px-4 rounded-full font-bold text-sm sm:text-base transition-all"
                style="color: var(--text-secondary);">
                🍅 番茄計時
            </button>
        </nav>

        <!-- ==================== 分頁 1：雙模式可愛時鐘 ==================== -->
        <section id="view-clock" class="w-full theme-card rounded-[2.25rem] p-6 sm:p-8 flex flex-col items-center relative">
            
            <!-- 互動鼓勵小語氣泡 (點擊時鐘時彈出) -->
            <div id="speech-bubble" class="hidden absolute -top-5 left-1/2 transform -translate-x-1/2 z-20 whitespace-nowrap px-4 py-2 rounded-2xl font-bold text-sm shadow-lg border-2"
                 style="background-color: var(--clock-face); border-color: var(--accent-main); color: var(--text-primary);">
                <span id="speech-text">今天也要元氣滿滿喔！✨</span>
                <!-- 氣泡小尾巴 -->
                <div class="w-3 h-3 rotate-45 absolute -bottom-1.5 left-1/2 -translate-x-1/2 border-r-2 border-b-2"
                     style="background-color: var(--clock-face); border-color: var(--accent-main);"></div>
            </div>

            <!-- 提示小字 -->
            <p class="text-xs font-medium opacity-75 mb-3 flex items-center gap-1" style="color: var(--text-secondary);">
                <span>✨ 點擊時鐘臉龐會有小驚喜喔！</span>
            </p>

            <!-- 可愛動物耳朵 + 指針時鐘主體 -->
            <div id="clock-interactive-area" onclick="pokeClock()" 
                 class="relative w-60 h-60 sm:w-68 sm:h-68 flex items-center justify-center cursor-pointer clock-bounce transition-transform duration-200 my-1"
                 role="button" tabindex="0" aria-label="可愛指針時鐘，點擊可互動">
                
                <!-- 可愛小耳朵 SVG (隨主題變色) -->
                <svg class="absolute -top-5 w-56 h-20 pointer-events-none z-0" viewBox="0 0 220 80">
                    <!-- 左耳 -->
                    <path d="M 28 68 C 12 20, 42 5, 68 38 Z" fill="var(--clock-rim)" />
                    <path d="M 34 62 C 24 30, 44 20, 60 40 Z" fill="var(--accent-sub)" />
                    <!-- 右耳 -->
                    <path d="M 192 68 C 208 20, 178 5, 152 38 Z" fill="var(--clock-rim)" />
                    <path d="M 186 62 C 196 30, 176 20, 160 40 Z" fill="var(--accent-sub)" />
                </svg>

                <!-- 圓形鐘面 -->
                <div class="clock-dial relative w-56 h-56 sm:w-64 sm:h-64 rounded-full flex items-center justify-center z-10 overflow-hidden">
                    
                    <!-- 日夜小圖示指示器 (6點鐘方向上方) -->
                    <div id="day-night-badge" class="absolute bottom-8 px-2.5 py-0.5 rounded-full text-xs font-bold flex items-center gap-1 shadow-xs"
                         style="background-color: var(--bg-gradient); color: var(--text-secondary);">
                        <span id="day-night-icon">☀️</span>
                        <span id="day-night-label">白天</span>
                    </div>

                    <!-- 刻度與數字 SVG -->
                    <svg class="w-full h-full" viewBox="0 0 200 200">
                        <!-- 12 個圓點刻度 -->
                        <g id="clock-ticks"></g>
                        
                        <!-- 可愛大數字 (12, 3, 6, 9) -->
                        <text x="100" y="34" text-anchor="middle" fill="var(--text-primary)" font-size="16" font-weight="900">12</text>
                        <text x="170" y="106" text-anchor="middle" fill="var(--text-primary)" font-size="16" font-weight="900">3</text>
                        <text x="100" y="178" text-anchor="middle" fill="var(--text-primary)" font-size="16" font-weight="900">6</text>
                        <text x="30" y="106" text-anchor="middle" fill="var(--text-primary)" font-size="16" font-weight="900">9</text>

                        <!-- 可愛表情臉部 (位於鐘面中央偏上) -->
                        <g id="clock-face-expression">
                            <!-- 左眼 -->
                            <g class="eye-open" style="transform-origin: 72px 86px;">
                                <circle cx="72" cy="86" r="5.5" fill="var(--text-primary)" />
                                <circle cx="70" cy="84" r="2" fill="#FFFFFF" />
                            </g>
                            <!-- 右眼 -->
                            <g class="eye-open" style="transform-origin: 128px 86px;">
                                <circle cx="128" cy="86" r="5.5" fill="var(--text-primary)" />
                                <circle cx="126" cy="84" r="2" fill="#FFFFFF" />
                            </g>
                            <!-- 害羞腮紅 (預設微紅，點擊時變深變大) -->
                            <ellipse id="cheek-left" cx="60" cy="95" rx="7" ry="4" fill="var(--cheek-color)" opacity="0.45" class="transition-all duration-300" />
                            <ellipse id="cheek-right" cx="140" cy="95" rx="7" ry="4" fill="var(--cheek-color)" opacity="0.45" class="transition-all duration-300" />
                            <!-- 微笑貓咪嘴 (w形) -->
                            <path id="cute-mouth" d="M 92 93 Q 96 98 100 93 Q 104 98 108 93" fill="none" stroke="var(--text-primary)" stroke-width="2.5" stroke-linecap="round" />
                        </g>

                        <!-- 時針 -->
                        <line id="hand-hour" x1="100" y1="100" x2="100" y2="56" 
                              stroke="var(--hand-hour)" stroke-width="6.5" stroke-linecap="round" />
                        
                        <!-- 分針 -->
                        <line id="hand-minute" x1="100" y1="100" x2="100" y2="38" 
                              stroke="var(--hand-min)" stroke-width="4.5" stroke-linecap="round" />
                        
                        <!-- 秒針 (帶有可愛小尾巴) -->
                        <g id="hand-second">
                            <line x1="100" y1="116" x2="100" y2="30" 
                                  stroke="var(--hand-sec)" stroke-width="2.5" stroke-linecap="round" />
                            <circle cx="100" cy="36" r="3.5" fill="var(--hand-sec)" />
                        </g>

                        <!-- 中心可愛小鼻子圓鈕 -->
                        <circle cx="100" cy="100" r="6.5" fill="var(--accent-main)" stroke="#FFFFFF" stroke-width="2" />
                    </svg>
                </div>
            </div>

            <!-- 清晰大字體數位時鐘與日期 -->
            <div class="mt-5 w-full rounded-3xl p-4 text-center border-2" 
                 style="background-color: var(--clock-face); border-color: var(--card-border);">
                <!-- 日期與星期 -->
                <div id="digital-date" class="text-sm sm:text-base font-bold tracking-wide mb-1" style="color: var(--text-secondary);">
                    2026年11月25日 星期三
                </div>
                <!-- 數位時間 -->
                <div class="flex items-baseline justify-center gap-1.5">
                    <span id="digital-ampm" class="text-xs sm:text-sm font-extrabold px-2 py-0.5 rounded-lg"
                          style="background-color: var(--accent-sub); color: var(--text-primary);">
                        下午
                    </span>
                    <span id="digital-time" class="text-4xl sm:text-5xl font-black tracking-wider tabular-nums" style="color: var(--text-primary);">
                        07:32
                    </span>
                    <span id="digital-seconds" class="text-xl sm:text-2xl font-extrabold tabular-nums" style="color: var(--accent-main);">
                        00
                    </span>
                </div>
            </div>
        </section>

        <!-- ==================== 分頁 2：可愛番茄鐘 / 倒數計時器 ==================== -->
        <section id="view-pomodoro" class="hidden w-full theme-card rounded-[2.25rem] p-6 sm:p-8 flex-col items-center">
            
            <!-- 模式預設按鈕 (專注 25分 / 短休 5分 / 泡麵 3分) -->
            <div class="flex flex-wrap justify-center gap-2 mb-6 w-full">
                <button onclick="setTimerPreset(25, '專注時刻 🍅')" 
                    class="cute-btn px-3.5 py-1.5 rounded-2xl text-xs sm:text-sm font-bold border-2"
                    style="background-color: var(--clock-face); border-color: var(--card-border); color: var(--text-primary);">
                    🍅 專注 25分
                </button>
                <button onclick="setTimerPreset(5, '休息一下 ☕')" 
                    class="cute-btn px-3.5 py-1.5 rounded-2xl text-xs sm:text-sm font-bold border-2"
                    style="background-color: var(--clock-face); border-color: var(--card-border); color: var(--text-primary);">
                    ☕ 小憩 5分
                </button>
                <button onclick="setTimerPreset(3, '泡麵計時 🍜')" 
                    class="cute-btn px-3.5 py-1.5 rounded-2xl text-xs sm:text-sm font-bold border-2"
                    style="background-color: var(--clock-face); border-color: var(--card-border); color: var(--text-primary);">
                    🍜 泡麵 3分
                </button>
            </div>

            <!-- 圓形進度條與倒數顯示 -->
            <div class="relative w-56 h-56 sm:w-60 sm:h-60 flex items-center justify-center my-2">
                <svg class="w-full h-full -rotate-90" viewBox="0 0 200 200">
                    <!-- 背景軌道 -->
                    <circle cx="100" cy="100" r="86" fill="var(--clock-face)" stroke="var(--card-border)" stroke-width="12" />
                    <!-- 動態進度條 -->
                    <circle id="timer-progress-ring" cx="100" cy="100" r="86" fill="none" 
                            stroke="var(--accent-main)" stroke-width="12" stroke-linecap="round"
                            stroke-dasharray="540.35" stroke-dashoffset="0"
                            class="transition-all duration-500 ease-linear" />
                </svg>

                <!-- 中央倒數時間文字 -->
                <div class="absolute inset-0 flex flex-col items-center justify-center">
                    <span id="timer-status-label" class="text-xs sm:text-sm font-bold px-3 py-0.5 rounded-full mb-1"
                          style="background-color: var(--accent-sub); color: var(--text-primary);">
                        專注時刻 🍅
                    </span>
                    <div id="timer-display" class="text-4xl sm:text-5xl font-black tracking-wider tabular-nums" style="color: var(--text-primary);">
                        25:00
                    </div>
                    <!-- 自訂加減分鐘微調 -->
                    <div class="flex items-center gap-3 mt-2">
                        <button onclick="adjustTimerMinutes(-1)" title="減少1分鐘"
                            class="cute-btn w-7 h-7 rounded-full font-black text-base flex items-center justify-center border"
                            style="background-color: var(--clock-face); border-color: var(--card-border); color: var(--text-primary);">-</button>
                        <span class="text-xs font-bold opacity-70">微調分鐘</span>
                        <button onclick="adjustTimerMinutes(1)" title="增加1分鐘"
                            class="cute-btn w-7 h-7 rounded-full font-black text-base flex items-center justify-center border"
                            style="background-color: var(--clock-face); border-color: var(--card-border); color: var(--text-primary);">+</button>
                    </div>
                </div>
            </div>

            <!-- 計時器操作按鈕 (開始/暫停 & 重設) -->
            <div class="flex items-center gap-3 mt-6 w-full justify-center">
                <button id="timer-start-btn" onclick="toggleTimer()" 
                    class="cute-btn flex-1 max-w-[160px] py-3 px-6 rounded-2xl font-extrabold text-base sm:text-lg text-white shadow-md flex items-center justify-center gap-2"
                    style="background-color: var(--accent-main);">
                    <span id="timer-btn-icon">▶️</span>
                    <span id="timer-btn-text">開始</span>
                </button>
                <button onclick="resetTimer()" 
                    class="cute-btn py-3 px-5 rounded-2xl font-bold text-base border-2"
                    style="background-color: var(--clock-face); border-color: var(--card-border); color: var(--text-primary);">
                    🔄 重設
                </button>
            </div>

            <!-- 完成提示訊息框 (取代 alert) -->
            <div id="timer-complete-banner" class="hidden mt-4 w-full py-2.5 px-4 rounded-2xl text-center font-bold text-sm animate-bounce border-2"
                 style="background-color: var(--accent-sub); border-color: var(--accent-main); color: var(--text-primary);">
                🎉 時間到囉！辛苦了，喝口水伸個懶腰吧～ ✨
            </div>
        </section>

    </main>

    <script>
        /* ==========================================================================
           1. 狀態管理與主題設定
           ========================================================================== */
        const THEMES = {
            strawberry: { name: '草莓牛奶 🍓', type: 'clouds' },
            matcha:     { name: '抹茶布丁 🍮', type: 'clouds' },
            soda:       { name: '蘇打汽水 🫧', type: 'bubbles' },
            starry:     { name: '深夜星空 🌙', type: 'stars' }
        };

        const CUTE_MESSAGES = [
            "今天也要元氣滿滿喔！✨",
            "記得多喝水，照顧好自己 💖",
            "你已經做得非常棒了呢！🌸",
            "休息一下也沒關係的喔～ ☁️",
            "微笑是最可愛的魔法！😊",
            "咕嚕咕嚕～時間正在快樂前進 🎵",
            "加油加油！好運正在路上 🍀",
            "深呼吸，放鬆一下肩膀吧 🧸"
        ];

        let currentTheme = 'strawberry';
        let soundEnabled = false;
        let audioCtx = null;
        let lastSecond = -1;
        let bubbleTimeout = null;
        let blinkInterval = null;

        /* ==========================================================================
           2. Web Audio API 合成輕柔音效 (無需外部音檔)
           ========================================================================== */
        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // 播放可愛輕柔的木魚/水滴感「滴答」聲
        function playTickSound(isEvenSecond) {
            if (!soundEnabled) return;
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                // 偶數秒音調稍高(滴)，奇數秒音調稍低(答)
                osc.type = 'sine';
                osc.frequency.setValueAtTime(isEvenSecond ? 880 : 660, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(isEvenSecond ? 440 : 330, audioCtx.currentTime + 0.04);

                gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.045);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } catch (e) {
                console.warn('音效播放受限:', e);
            }
        }

        // 點擊時鐘時的可愛「波啾」聲
        function playPokeSound() {
            if (!soundEnabled) return;
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(520, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(980, audioCtx.currentTime + 0.12);

                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.14);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch (e) {}
        }

        // 番茄鐘完成時的可愛和弦鈴聲
        function playAlarmSound() {
            try {
                initAudio();
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    const startTime = audioCtx.currentTime + idx * 0.14;

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, startTime);

                    gain.gain.setValueAtTime(0.15, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.45);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start(startTime);
                    osc.stop(startTime + 0.46);
                });
            } catch (e) {}
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const iconEl = document.getElementById('sound-icon');
            const textEl = document.getElementById('sound-text');
            
            if (soundEnabled) {
                initAudio();
                iconEl.textContent = '🔔';
                textEl.textContent = '滴答開';
                playPokeSound();
            } else {
                iconEl.textContent = '🔇';
                textEl.textContent = '靜音';
            }
        }

        /* ==========================================================================
           3. 主題切換與背景漂浮動畫生成
           ========================================================================== */
        function setTheme(themeKey) {
            currentTheme = themeKey;
            document.documentElement.setAttribute('data-theme', themeKey);
            document.getElementById('theme-label').textContent = THEMES[themeKey].name;

            // 更新主題按鈕選中光環
            document.querySelectorAll('[data-theme-btn]').forEach(btn => {
                if (btn.getAttribute('data-theme-btn') === themeKey) {
                    btn.classList.add('ring-2', 'ring-offset-2', 'scale-110');
                } else {
                    btn.classList.remove('ring-2', 'ring-offset-2', 'scale-110');
                }
            });

            renderBackgroundDecorations(THEMES[themeKey].type);
        }

        function renderBackgroundDecorations(type) {
            const container = document.getElementById('bg-decorations');
            container.innerHTML = '';

            const count = 10;
            for (let i = 0; i < count; i++) {
                const el = document.createElement('div');
                el.className = 'floating-item';
                
                const left = Math.random() * 92;
                const top = Math.random() * 90;
                const delay = (Math.random() * 5).toFixed(2);
                const duration = (6 + Math.random() * 5).toFixed(2);
                const scale = (0.6 + Math.random() * 0.7).toFixed(2);

                el.style.left = `${left}%`;
                el.style.top = `${top}%`;
                el.style.animationDelay = `${delay}s`;
                el.style.animationDuration = `${duration}s`;
                el.style.transform = `scale(${scale})`;

                if (type === 'clouds') {
                    el.innerHTML = `
                        <svg width="80" height="45" viewBox="0 0 80 45" fill="var(--floating-color)">
                            <path d="M20 38 H62 A13 13 0 0 0 62 12 A17 17 0 0 0 30 9 A14 14 0 0 0 20 38 Z"/>
                        </svg>`;
                } else if (type === 'bubbles') {
                    const size = 24 + Math.floor(Math.random() * 32);
                    el.innerHTML = `
                        <div style="width:${size}px; height:${size}px; border-radius:50%; background: radial-gradient(circle at 30% 30%, #ffffff, rgba(255,255,255,0.2)); border: 1.5px solid rgba(255,255,255,0.8);"></div>`;
                } else {
                    // 星星
                    const size = 18 + Math.floor(Math.random() * 18);
                    el.style.animation = `twinkle ${duration}s ease-in-out ${delay}s infinite`;
                    el.innerHTML = `
                        <svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="var(--floating-color)">
                            <path d="M12 2L14.8 8.5L22 9.3L16.5 14L18.2 21L12 17.3L5.8 21L7.5 14L2 9.3L9.2 8.5L12 2Z"/>
                        </svg>`;
                }
                container.appendChild(el);
            }
        }

        /* ==========================================================================
           4. 指針時鐘與數位時鐘核心邏輯
           ========================================================================== */
        function buildClockTicks() {
            const ticksGroup = document.getElementById('clock-ticks');
            for (let i = 0; i < 12; i++) {
                // 跳過 12, 3, 6, 9 的數字位置，改用小圓點點綴
                if (i % 3 === 0) continue;
                const angle = (i * 30) * (Math.PI / 180);
                const r = 80;
                const cx = 100 + r * Math.sin(angle);
                const cy = 100 - r * Math.cos(angle);

                const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                dot.setAttribute('cx', cx);
                dot.setAttribute('cy', cy);
                dot.setAttribute('r', '2.8');
                dot.setAttribute('fill', 'var(--accent-sub)');
                ticksGroup.appendChild(dot);
            }
        }

        function updateClocks() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            const milliseconds = now.getMilliseconds();

            // 1. 觸發每秒滴答聲
            if (seconds !== lastSecond) {
                lastSecond = seconds;
                playTickSound(seconds % 2 === 0);
            }

            // 2. 更新平滑擺動指針角度
            const smoothSec = seconds + milliseconds / 1000;
            const secDeg = smoothSec * 6;
            const minDeg = (minutes + smoothSec / 60) * 6;
            const hourDeg = ((hours % 12) + minutes / 60) * 30;

            document.getElementById('hand-second').setAttribute('transform', `rotate(${secDeg} 100 100)`);
            document.getElementById('hand-minute').setAttribute('transform', `rotate(${minDeg} 100 100)`);
            document.getElementById('hand-hour').setAttribute('transform', `rotate(${hourDeg} 100 100)`);

            // 3. 更新日夜小圖示 (06:00 ~ 17:59 為白天太陽，其餘為夜晚月亮)
            const isDaytime = hours >= 6 && hours < 18;
            document.getElementById('day-night-icon').textContent = isDaytime ? '☀️' : '🌙';
            document.getElementById('day-night-label').textContent = isDaytime ? '白天' : '夜晚';

            // 4. 更新數位時鐘與繁體中文日期
            const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const dayName = weekDays[now.getDay()];

            document.getElementById('digital-date').textContent = `${year}年${month}月${date}日 ${dayName}`;
            
            const ampm = hours < 12 ? '上午' : '下午';
            const displayHour = String(hours % 12 || 12).padStart(2, '0');
            const displayMin = String(minutes).padStart(2, '0');
            const displaySec = String(seconds).padStart(2, '0');

            document.getElementById('digital-ampm').textContent = ampm;
            document.getElementById('digital-time').textContent = `${displayHour}:${displayMin}`;
            document.getElementById('digital-seconds').textContent = displaySec;

            requestAnimationFrame(updateClocks);
        }

        /* ==========================================================================
           5. 互動彩蛋：眨眼、臉紅、鼓勵氣泡
           ========================================================================== */
        function triggerBlink() {
            const face = document.getElementById('clock-face-expression');
            face.classList.add('blinking');
            setTimeout(() => {
                face.classList.remove('blinking');
            }, 180);
        }

        function pokeClock() {
            playPokeSound();
            triggerBlink();

            // 腮紅變大變深
            const leftCheek = document.getElementById('cheek-left');
            const rightCheek = document.getElementById('cheek-right');
            leftCheek.setAttribute('rx', '10');
            leftCheek.setAttribute('ry', '5.5');
            leftCheek.setAttribute('opacity', '0.85');
            rightCheek.setAttribute('rx', '10');
            rightCheek.setAttribute('ry', '5.5');
            rightCheek.setAttribute('opacity', '0.85');

            // 隨機挑選鼓勵語句並重啟氣泡動畫
            const bubble = document.getElementById('speech-bubble');
            const textEl = document.getElementById('speech-text');
            const randomMsg = CUTE_MESSAGES[Math.floor(Math.random() * CUTE_MESSAGES.length)];
            textEl.textContent = randomMsg;

            bubble.classList.remove('hidden', 'speech-bubble');
            void bubble.offsetWidth; // 強制重繪以重新播放動畫
            bubble.classList.add('speech-bubble');

            clearTimeout(bubbleTimeout);
            bubbleTimeout = setTimeout(() => {
                bubble.classList.add('hidden');
                // 恢復自然腮紅
                leftCheek.setAttribute('rx', '7');
                leftCheek.setAttribute('ry', '4');
                leftCheek.setAttribute('opacity', '0.45');
                rightCheek.setAttribute('rx', '7');
                rightCheek.setAttribute('ry', '4');
                rightCheek.setAttribute('opacity', '0.45');
            }, 3200);
        }

        // 每隔幾秒自動自然眨眼一次
        function startAutoBlink() {
            blinkInterval = setInterval(() => {
                triggerBlink();
            }, 4200);
        }

        /* ==========================================================================
           6. 分頁切換 & 可愛番茄鐘計時器
           ========================================================================== */
        function switchTab(tabName) {
            const viewClock = document.getElementById('view-clock');
            const viewPomodoro = document.getElementById('view-pomodoro');
            const tabClock = document.getElementById('tab-clock');
            const tabPomodoro = document.getElementById('tab-pomodoro');

            if (tabName === 'clock') {
                viewClock.classList.remove('hidden');
                viewClock.classList.add('flex');
                viewPomodoro.classList.add('hidden');
                viewPomodoro.classList.remove('flex');

                tabClock.style.backgroundColor = 'var(--accent-main)';
                tabClock.style.color = '#FFFFFF';
                tabPomodoro.style.backgroundColor = 'transparent';
                tabPomodoro.style.color = 'var(--text-secondary)';
            } else {
                viewClock.classList.add('hidden');
                viewClock.classList.remove('flex');
                viewPomodoro.classList.remove('hidden');
                viewPomodoro.classList.add('flex');

                tabPomodoro.style.backgroundColor = 'var(--accent-main)';
                tabPomodoro.style.color = '#FFFFFF';
                tabClock.style.backgroundColor = 'transparent';
                tabClock.style.color = 'var(--text-secondary)';
            }
        }

        // 番茄鐘狀態變數
        let totalSeconds = 25 * 60;
        let remainingSeconds = 25 * 60;
        let timerInterval = null;
        let isTimerRunning = false;
        const CIRCLE_CIRCUMFERENCE = 2 * Math.PI * 86; // 540.35

        function updateTimerUI() {
            const mins = Math.floor(remainingSeconds / 60);
            const secs = remainingSeconds % 60;
            document.getElementById('timer-display').textContent = 
                `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

            // 更新 SVG 圓環進度
            const progress = totalSeconds > 0 ? (remainingSeconds / totalSeconds) : 0;
            const offset = CIRCLE_CIRCUMFERENCE * (1 - progress);
            document.getElementById('timer-progress-ring').style.strokeDashoffset = offset;
        }

        function setTimerPreset(minutes, label) {
            pauseTimer();
            document.getElementById('timer-complete-banner').classList.add('hidden');
            document.getElementById('timer-status-label').textContent = label;
            totalSeconds = minutes * 60;
            remainingSeconds = totalSeconds;
            updateTimerUI();
            playPokeSound();
        }

        function adjustTimerMinutes(delta) {
            if (isTimerRunning) return;
            document.getElementById('timer-complete-banner').classList.add('hidden');
            const newMins = Math.max(1, Math.min(99, Math.floor(remainingSeconds / 60) + delta));
            totalSeconds = newMins * 60;
            remainingSeconds = totalSeconds;
            updateTimerUI();
        }

        function toggleTimer() {
            if (isTimerRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            if (remainingSeconds <= 0) {
                remainingSeconds = totalSeconds;
            }
            document.getElementById('timer-complete-banner').classList.add('hidden');
            isTimerRunning = true;
            document.getElementById('timer-btn-icon').textContent = '⏸️';
            document.getElementById('timer-btn-text').textContent = '暫停';
            playPokeSound();

            timerInterval = setInterval(() => {
                if (remainingSeconds > 0) {
                    remainingSeconds--;
                    updateTimerUI();
                } else {
                    pauseTimer();
                    document.getElementById('timer-complete-banner').classList.remove('hidden');
                    playAlarmSound();
                }
            }, 1000);
        }

        function pauseTimer() {
            isTimerRunning = false;
            clearInterval(timerInterval);
            document.getElementById('timer-btn-icon').textContent = '▶️';
            document.getElementById('timer-btn-text').textContent = '開始';
        }

        function resetTimer() {
            pauseTimer();
            document.getElementById('timer-complete-banner').classList.add('hidden');
            remainingSeconds = totalSeconds;
            updateTimerUI();
        }

        /* ==========================================================================
           7. 頁面初始化
           ========================================================================== */
        window.addEventListener('DOMContentLoaded', () => {
            buildClockTicks();
            setTheme('strawberry');
            updateTimerUI();
            startAutoBlink();
            requestAnimationFrame(updateClocks);
        });
    </script>
</body>
